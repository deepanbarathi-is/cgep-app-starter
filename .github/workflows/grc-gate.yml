# GRC gate. On every pull request it checks the code, plans the change with a read-only
# AWS role, and runs the HIPAA policy suite against the plan. A failed policy fails the
# job, so the pull request cannot merge. When a change is merged to main, the same job
# runs again with the apply role and applies the exact plan that the policy gate checked,
# then builds an evidence bundle, signs it with Cosign, and stores it in the evidence vault.
name: grc-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Two applies must never run at once. Pull request runs can be replaced by a newer push.
concurrency:
  group: terraform-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# id-token lets the job ask GitHub for the signed token that AWS trusts. Nothing else.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  PLAN_ROLE_ARN: arn:aws:iam::650251713518:role/acme-health-pipeline-plan
  APPLY_ROLE_ARN: arn:aws:iam::650251713518:role/acme-health-pipeline-apply
  EVIDENCE_VAULT: acme-health-intake-evidence-5c657426
  TERRAFORM_VERSION: "1.16.1"
  OPA_VERSION: "1.19.0"
  CONFTEST_VERSION: "0.70.1"
  TF_IN_AUTOMATION: "true"

jobs:
  plan-and-gate:
    name: Plan and policy gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install OPA and Conftest
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL -o "$HOME/bin/opa" \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x "$HOME/bin/opa"
          curl -fsSL \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C "$HOME/bin" conftest
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Check and test the policies
        run: |
          test -z "$(opa fmt --list policies)"
          opa check policies --strict
          opa test policies

      - name: Break tests for the policy gate
        run: test/policy-breaks.sh

      # Pull requests get the read-only plan role. A merge to main gets the apply role. AWS
      # only trusts each role for the matching token, so a pull request cannot get the
      # apply role.
      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ github.event_name == 'push' && env.APPLY_ROLE_ARN || env.PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init and validate
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform validate

      # The plan role is read-only, so it cannot take the state lock. Pull request plans
      # never write state, so -lock=false is safe there. A merge takes the lock.
      - name: Terraform plan
        working-directory: terraform
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          LOCK_STATE: ${{ github.event_name == 'push' }}
        run: |
          terraform plan -lock="$LOCK_STATE" -input=false -no-color -out=tfplan
          terraform show -json tfplan > plan.json

      # An empty or malformed plan would pass every policy without checking anything.
      - name: Refuse a plan that is not a real plan
        working-directory: terraform
        run: jq -e '(.resource_changes | type == "array") and (.resource_changes | length > 0)' plan.json

      # The plan JSON carries variable values, including the alert email. Remove them
      # before the file is kept as an artifact on a public repository.
      - name: Redact the plan for the artifact
        if: always()
        working-directory: terraform
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          if [ -f plan.json ]; then
            if [ -n "$ALERT_EMAIL" ]; then
              jq --arg e "$ALERT_EMAIL" 'del(.variables) | walk(if type == "string" then split($e) | join("<redacted>") else . end)' plan.json > plan-redacted.json
            else
              jq 'del(.variables)' plan.json > plan-redacted.json
            fi
          fi

      - name: Policy gate (Conftest)
        run: conftest test terraform/plan.json --policy policies --all-namespaces

      # Runs only on a merge to main, after the guard and the policy gate have passed. It
      # applies the saved plan file, so what is applied is exactly what was checked.
      - name: Terraform apply (merge to main only)
        if: github.event_name == 'push'
        working-directory: terraform
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          set -o pipefail
          terraform apply -input=false -no-color tfplan 2>&1 | tee apply.log
          if [ -n "$ALERT_EMAIL" ]; then sed -i "s|$ALERT_EMAIL|<redacted>|g" apply.log; fi

      # Evidence, on a merge to main only and only after the apply succeeded. A pull request
      # can never produce signed evidence.
      - name: Install Cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Build the evidence bundle
        if: github.event_name == 'push'
        run: scripts/build-evidence.sh terraform/plan-redacted.json out terraform/apply.log

      # Keyless signing: the job proves who it is with GitHub's token, Sigstore issues a
      # short-lived certificate for that identity, and the signature is logged publicly in
      # Rekor. There is no signing key to steal. The bundle is verified straight away
      # against this exact workflow, so a bad signature never reaches the vault.
      - name: Sign the bundle with Cosign and verify the signature
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          bundle="$(ls out/evidence-*.tar.gz)"
          cosign sign-blob --yes --bundle "$bundle.sig.bundle" "$bundle"
          cosign verify-blob \
            --bundle "$bundle.sig.bundle" \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/grc-gate.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$bundle"

      - name: Upload the bundle and receipt to the evidence vault
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          bundle="$(ls out/evidence-*.tar.gz)"
          scripts/upload-evidence.sh "$bundle" "$EVIDENCE_VAULT" out/receipt.json

      - name: Keep the signed evidence as an artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: signed-evidence
          path: out/
          retention-days: 90

      - name: Summarise the plan
        if: always()
        working-directory: terraform
        run: |
          if [ -f plan.json ]; then
            {
              echo "### Terraform plan"
              jq -r '[.resource_changes[].change.actions[0]] | group_by(.) | map("\(.[0]): \(length)") | join(", ")' plan.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the plan as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plan-json
          path: terraform/plan-redacted.json
          retention-days: 30
          if-no-files-found: warn
